<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kana Josensei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--bg:#161a35;--bg2:#222850;--ink:#f3efe4;--dim:#9aa0c8;--hira:#f6a9c4;--kata:#6fd6c6;--bad:#ff7a7a;--gold:#ffd77a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding:10px 12px}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:1.05rem;padding:2px 4px}
.hud b{font-size:1.5rem;color:var(--gold)}
#field{position:relative;flex:1;min-height:0;border:2px solid #343b72;border-radius:14px;overflow:hidden;background:linear-gradient(#1a1f42,#12152e)}
#field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bad);opacity:.7}
.k{position:absolute;top:0;font-size:2.6rem;font-weight:900;line-height:1;padding:6px 10px;border-radius:12px;background:#0e1126aa;transform:translateX(-50%);will-change:top}
.k.h{color:var(--hira);border:2px solid #f6a9c455}
.k.t{color:var(--kata);border:2px solid #6fd6c655}
.k.ok{animation:pop .35s forwards}
.k.no{animation:fall .4s forwards;color:var(--bad)}
@keyframes pop{to{transform:translateX(-50%) scale(1.8);opacity:0}}
@keyframes fall{to{opacity:0;transform:translateX(-50%) translateY(30px)}}
.float{position:absolute;font-weight:900;color:var(--gold);pointer-events:none;animation:up .8s forwards;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-40px);opacity:0}}
#bar{display:flex;gap:8px;margin-top:10px}
#inp{flex:1;font:inherit;font-size:1.4rem;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid #4a529a;background:#0e1126;color:var(--ink);text-align:center;outline:none}
#inp:focus{border-color:var(--gold)}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:#2b3270;border:2px solid #4a529a;border-radius:12px;padding:10px 16px}
button:hover,button:focus-visible{border-color:var(--gold);outline:none}
button.sel{background:var(--gold);color:#1a1d3a;border-color:var(--gold)}
#menu,#over{position:absolute;inset:0;background:#0b0e22ee;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:16px;text-align:center;overflow:auto}
#over{display:none}
h1{margin:0;font-size:2.4rem;font-weight:900}
h1 span{color:var(--hira)}h1 i{font-style:normal;color:var(--kata)}
p{margin:0;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lbl{font-size:.95rem;color:var(--dim);margin-top:4px}
#go{background:var(--gold);color:#1a1d3a;border-color:var(--gold);font-size:1.2rem;padding:12px 34px;margin-top:8px}
#kb{display:none;grid-template-columns:repeat(20,1fr);gap:5px;margin-top:8px}
#kb button{grid-column:span 2;min-width:0;padding:11px 0;font-size:1.1rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#o-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
#o-list span{font-size:1.3rem;font-weight:700;padding:6px 12px;border-radius:10px;background:#0e1126;border:2px solid #4a529a}
#o-list span.h{color:var(--hira)}#o-list span.t{color:var(--kata)}
#o-list span em{font-style:normal;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.k.ok,.k.no,.float{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><span>Puntos <b id="sc">0</b></span><span id="combo"></span><span id="lv">❤❤❤❤❤</span></div>
  <div id="field">
    <div id="menu">
      <h1><span>かな</span> Josensei <i>カナ</i></h1>
      <p>Escribe en romaji la lectura de cada kana antes de que toque el piso. Mientras más arriba lo aciertes, más puntos.</p>
      <div class="lbl">Silabario</div>
      <div class="row" id="m-set"><button data-v="h" class="sel">Hiragana</button><button data-v="t">Katakana</button><button data-v="b">Ambos</button></div>
      <div class="lbl">Velocidad</div>
      <div class="row" id="m-spd"><button data-v="0">Tranquilo</button><button data-v="1" class="sel">Normal</button><button data-v="2">Rápido</button></div>
      <button id="go">Jugar</button>
    </div>
    <div id="over">
      <h1 id="o-t">Fin del juego</h1>
      <p id="o-s"></p>
      <p id="o-h"></p>
      <div id="o-list"></div>
      <button id="again">Volver al menú</button>
    </div>
  </div>
  <div id="bar"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí (ej: ka)" aria-label="Lectura en romaji"></div>
  <div id="kb"></div>
</div>
<script>
const H="あいうえお かきくけこ さしすせそ たちつてと なにぬねの はひふへほ まみむめも やゆよ らりるれろ わをん".split(" ").join("").split("");
const T="アイウエオ カキクケコ サシスセソ タチツテト ナニヌネノ ハヒフヘホ マミムメモ ヤユヨ ラリルレロ ワヲン".split(" ").join("").split("");
const R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa o n".split(" ");
const ALT={shi:["si"],chi:["ti"],tsu:["tu"],fu:["hu"],n:["nn"]};
const okr=i=>{const r=R[i];return [r].concat(ALT[r]||[]).concat(i===45?["wo"]:[])};
const $=id=>document.getElementById(id);
const missed=new Map();
const TOUCH=matchMedia("(pointer:coarse)").matches;
let set="h",spd=1,items=[],score=0,lives=5,combo=0,run=false,last=0,spawnT=0,buf="",bufT=0,hits=0;
const SPD=[[45,2.4],[75,1.7],[115,1.2]];
function pick(g,v){g.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b===v))}
$("m-set").onclick=e=>{if(e.target.dataset.v){set=e.target.dataset.v;pick($("m-set"),e.target)}};
$("m-spd").onclick=e=>{if(e.target.dataset.v){spd=+e.target.dataset.v;pick($("m-spd"),e.target)}};
$("go").onclick=start;
$("again").onclick=()=>{$("over").style.display="none";$("menu").style.display="flex"};
function start(){
  items.forEach(o=>o.el.remove());items=[];missed.clear();score=0;lives=5;combo=0;hits=0;buf="";$("inp").value="";
  $("menu").style.display="none";$("over").style.display="none";hud();run=true;last=performance.now();spawnT=0;if(!TOUCH)$("inp").focus();requestAnimationFrame(loop)
}
function hud(){$("sc").textContent=score;$("lv").textContent="❤".repeat(lives)+"♡".repeat(5-lives);$("combo").textContent=combo>2?"x"+combo+" racha":""}
function spawn(){
  const f=$("field"),w=f.clientWidth;
  const kata=set==="t"||(set==="b"&&Math.random()<.5);
  const i=Math.floor(Math.random()*46);
  const el=document.createElement("div");el.className="k "+(kata?"t":"h");el.textContent=(kata?T:H)[i];
  const x=40+Math.random()*(w-80);el.style.left=x+"px";f.appendChild(el);
  items.push({el,i,x,y:-50,sp:SPD[spd][0]*(1+Math.min(hits,60)*.012)*(.85+Math.random()*.3)})
}
function loop(t){
  if(!run)return;
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const H_=$("field").clientHeight;
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=SPD[spd][1]/(1+Math.min(hits,60)*.006)}
  for(const o of items){
    o.y+=o.sp*dt;o.el.style.top=o.y+"px";
    if(o.y>H_-o.el.offsetHeight){o.dead=1;missed.set(o.el.textContent,{r:R[o.i],k:o.el.classList.contains("t")});o.el.className+=" no";setTimeout(()=>o.el.remove(),400);lives--;combo=0;hud();if(lives<=0)end()}
  }
  items=items.filter(o=>!o.dead);
  if(buf&&t-bufT>1500){buf="";$("inp").value=""}
  requestAnimationFrame(loop)
}
function end(){
  run=false;$("o-t").textContent="Fin del juego";
  $("o-s").textContent=score+" puntos · "+hits+" kana acertados";
  const L=$("o-list");L.textContent="";
  $("o-h").textContent=missed.size?"Para repasar ("+missed.size+"):":"";
  missed.forEach((v,k)=>{const s=document.createElement("span");s.className=v.k?"t":"h";s.append(k+" - ");const e=document.createElement("em");e.textContent=v.r;s.append(e);L.append(s)});
  $("over").style.display="flex"
}
function tryHit(force){
  if(!buf)return;
  const cand=items.filter(o=>okr(o.i).includes(buf)).sort((a,b)=>b.y-a.y);
  if(!cand.length)return;
  const longer=items.some(o=>okr(o.i).some(r=>r.length>buf.length&&r.startsWith(buf)));
  if(longer&&!force)return;
  const o=cand[0],H_=$("field").clientHeight;
  const pts=Math.max(10,Math.round(100*(1-Math.max(0,o.y)/H_)))+Math.min(combo,10)*2;
  score+=pts;combo++;hits++;o.dead=1;o.el.className+=" ok";setTimeout(()=>o.el.remove(),350);
  const f=document.createElement("div");f.className="float";f.textContent="+"+pts;f.style.left=o.x+"px";f.style.top=o.y+"px";$("field").appendChild(f);setTimeout(()=>f.remove(),800);
  buf="";$("inp").value="";hud()
}
function feed(v){
  buf=v.toLowerCase().replace(/[^a-z]/g,"");$("inp").value=buf;bufT=performance.now();
  if(!run)return;
  tryHit(false);
  if(buf.length>3){buf="";$("inp").value="";combo=0;hud()}
}
$("inp").addEventListener("input",e=>feed(e.target.value));
function enter(){if(!run)return;tryHit(true);if(buf){buf="";$("inp").value="";combo=0;hud()}}
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
if(TOUCH){
  const i=$("inp"),kb=$("kb");i.readOnly=true;i.setAttribute("inputmode","none");i.placeholder="toca las letras";kb.style.display="grid";
  const mk=(t,fn,st)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(st)b.style.cssText=st;b.addEventListener("pointerdown",e=>{e.preventDefault();fn()});kb.append(b)};
  "qwertyuiopasdfghjklzxcvbnm".split("").forEach((c,n)=>mk(c,()=>feed(buf+c),n===10?"grid-column:2 / span 2":""));
  mk("⌫",()=>feed(buf.slice(0,-1)),"grid-column:span 3");mk("OK",enter,"grid-column:span 3");
}
document.addEventListener("keydown",e=>{if(run&&e.target!==$("inp")&&!e.ctrlKey&&!e.metaKey)$("inp").focus()});
</script>
</body>
</html>
